name: Deploy NowX

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: nowx-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:vinext
        env:
          NOWX_HYPERDRIVE_ID: e6a9749267764008814def924119d3fd
      - name: Deploy production Worker
        # cf 的配置差异包含控制台明文变量，只在公共日志中显示发布结果。
        run: |
          if ! pnpm exec cf deploy --prebuilt --mode production --no-provision > "$RUNNER_TEMP/nowx-deploy.log" 2>&1; then
            if grep -q 'because of conflicts' "$RUNNER_TEMP/nowx-deploy.log"; then
              echo "::error::Cloudflare 控制台与仓库配置有差异，请核对 NowX 的生产配置。"
            else
              echo "::error::NowX 发布失败，请检查 Cloudflare 部署状态。"
            fi
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: 98deece887490e2c794bf4a3e680c3d5
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOWX_DEPLOY_TOKEN }}
