# 本地开发数据库：docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nowx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nowx}
      POSTGRES_DB: ${POSTGRES_DB:-nowx}
    # 只绑定本机回环地址
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
